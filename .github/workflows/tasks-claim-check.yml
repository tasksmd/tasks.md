# Generated by `tasks fleet init`. Path-scoped claim gate — make this a REQUIRED
# check on protected branches so a code change can't merge without a live claim.
# Uses pull_request (NOT pull_request_target) so untrusted forks can't read secrets.
name: tasks-claim-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Enforce path-scoped claim
        run: |
          base="origin/${{ github.base_ref }}"
          paths=$(git diff --name-only "$base...HEAD")
          [ -z "$paths" ] && { echo "no changes"; exit 0; }
          # git's own trailer parser (same engine as git interpret-trailers).
          task=$(git log -1 --format='%(trailers:key=Task,valueonly)' | head -1)
          claim=$(git log -1 --format='%(trailers:key=Task-Claim,valueonly)' | head -1)
          git fetch origin '+refs/heads/tasks-claims:refs/heads/tasks-claims' || true
          npx -y @tasks-md/cli check-push --task "$task" --claim "$claim" $paths
