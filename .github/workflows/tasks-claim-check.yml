# Generated by `tasks fleet init`. Path-scoped claim gate.
#
# ADVISORY BY DEFAULT: a code change without a live task claim WARNS but does
# not block, so this never red-X's a bootstrap PR, a doc PR, or a human
# contribution. To make it a HARD gate (the threat model's "advisory → hard"
# step): run `scripts/arm-enforcement.sh` — it sets `TASKS_CLAIM_ENFORCE=1` and
# makes this check REQUIRED on the default-branch ruleset, in one action.
# (Force-push/delete protection of `tasks-claims` is a SEPARATE hardening — it
# must exempt the compaction bot — see the threat model, not part of arming.)
# See docs/security/git-native-claims-threat-model.md.
#
# Uses pull_request (NOT pull_request_target) so untrusted forks can't read secrets.
name: tasks-claim-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Path-scoped claim check
        env:
          ENFORCE: ${{ vars.TASKS_CLAIM_ENFORCE }}
          # Fetch the TRUSTED published cli from public npm at a PINNED version
          # (not @latest): a required (blocking) gate must be reproducible and
          # immune to a bad or not-yet-propagated publish. Bump CLI_VERSION when
          # check-push changes — read the target from PUBLIC npm, e.g.
          #   curl -s https://registry.npmjs.org/@tasks-md/cli | jq -r '."dist-tags".latest'
          # NOT a local `npm view` (the Artifactory mirror lags and served a stale
          # 0.7.0 that predates check-push). See AGENTS.md "Release And CI Gotchas".
          CLI_VERSION: "0.10.0"
          npm_config_registry: https://registry.npmjs.org
        run: |
          base="origin/${{ github.base_ref }}"
          paths=$(git diff --name-only "$base...HEAD")
          [ -z "$paths" ] && { echo "no changes"; exit 0; }
          # The pull_request HEAD is the auto-merge commit (no trailers), so scan
          # the PR's own commits (base..HEAD) for the newest Task / Task-Claim.
          # git's own trailer parser (same engine as git interpret-trailers).
          task=$(git log "$base..HEAD" --format='%(trailers:key=Task,valueonly)' | grep -m1 . || true)
          claim=$(git log "$base..HEAD" --format='%(trailers:key=Task-Claim,valueonly)' | grep -m1 . || true)
          git fetch origin '+refs/heads/tasks-claims:refs/heads/tasks-claims' || true
          # This repo IS the @tasks-md/cli workspace, so `npx @tasks-md/cli` would
          # resolve our OWN unbuilt local package (-> "tasks: not found"). Install
          # the published cli into a temp dir OUTSIDE the workspace, then run it
          # from the repo so check-push sees the repo's git + diff paths. We must
          # NOT build-local here: this runs on pull_request (untrusted head), and
          # building the PR's own cli would let it rewrite check-push to self-pass.
          tdir="$RUNNER_TEMP/tcli"
          mkdir -p "$tdir"
          (cd "$tdir" && npm init -y >/dev/null 2>&1 && npm install "@tasks-md/cli@${CLI_VERSION}") || echo "::warning::temp cli install failed"
          tcli="$tdir/node_modules/@tasks-md/cli/dist/cli.js"
          echo "resolved task='$task' claim='$claim'; cli=$([ -f "$tcli" ] && echo present || echo MISSING)"
          if [ -f "$tcli" ] && node "$tcli" check-push --task "$task" --claim "$claim" $paths; then
            exit 0
          fi
          # check-push rejected (code change without a valid live claim).
          if [ -n "$ENFORCE" ] && [ "$ENFORCE" != "0" ] && [ "$ENFORCE" != "false" ]; then
            echo "::error::code change without a live task claim (TASKS_CLAIM_ENFORCE is on)"
            exit 1
          fi
          echo "::warning::code change without a live task claim — advisory only. Set repo variable TASKS_CLAIM_ENFORCE=1 (+ required ruleset check) to enforce."
          exit 0
