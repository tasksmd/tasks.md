# Generated by `tasks fleet init`. Path-scoped claim gate.
#
# ADVISORY BY DEFAULT: a code change without a live task claim WARNS but does
# not block, so this never red-X's a bootstrap PR, a doc PR, or a human
# contribution. To make it a HARD gate (the threat model's "advisory → hard"
# step): set the repo variable `TASKS_CLAIM_ENFORCE=1`
# (`gh variable set TASKS_CLAIM_ENFORCE --body 1`) AND mark this check
# required on a branch ruleset that also blocks force-push/delete of
# `tasks-claims`. See docs/security/git-native-claims-threat-model.md.
#
# Uses pull_request (NOT pull_request_target) so untrusted forks can't read secrets.
name: tasks-claim-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Path-scoped claim check
        env:
          ENFORCE: ${{ vars.TASKS_CLAIM_ENFORCE }}
          # Resolve the TRUSTED published cli from public npm. This runs on
          # pull_request (untrusted PR head), so we must NOT build the PR's own
          # cli (a malicious PR could rewrite check-push to always pass and
          # bypass its own claim check). The pin also dodges registry mirror lag
          # that otherwise leaves a fresh release uninstallable -> vacuous pass.
          npm_config_registry: https://registry.npmjs.org
        run: |
          base="origin/${{ github.base_ref }}"
          paths=$(git diff --name-only "$base...HEAD")
          [ -z "$paths" ] && { echo "no changes"; exit 0; }
          # git's own trailer parser (same engine as git interpret-trailers).
          task=$(git log -1 --format='%(trailers:key=Task,valueonly)' | head -1)
          claim=$(git log -1 --format='%(trailers:key=Task-Claim,valueonly)' | head -1)
          git fetch origin '+refs/heads/tasks-claims:refs/heads/tasks-claims' || true
          if npx -y @tasks-md/cli check-push --task "$task" --claim "$claim" $paths; then
            exit 0
          fi
          # check-push rejected (code change without a valid live claim).
          if [ -n "$ENFORCE" ] && [ "$ENFORCE" != "0" ] && [ "$ENFORCE" != "false" ]; then
            echo "::error::code change without a live task claim (TASKS_CLAIM_ENFORCE is on)"
            exit 1
          fi
          echo "::warning::code change without a live task claim — advisory only. Set repo variable TASKS_CLAIM_ENFORCE=1 (+ required ruleset check) to enforce."
          exit 0
