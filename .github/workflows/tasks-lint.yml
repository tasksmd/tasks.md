name: Lint TASKS.md

on:
  workflow_call:
    inputs:
      paths:
        description: 'Space-separated list of files or directories to lint (default: TASKS.md)'
        required: false
        type: string
        default: 'TASKS.md'
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      fix:
        description: 'Run in --fix mode (auto-fix deterministic issues)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Lint TASKS.md files
        run: |
          args="${{ inputs.paths }}"
          if [ "${{ inputs.fix }}" = "true" ]; then
            args="--fix $args"
          fi
          npx @tasks-md/lint@latest $args
