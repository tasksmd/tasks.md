# Generated by `tasks fleet init`. Single-writer regeneration of TASKS.md
# from the tasks-claims log. See spec.md § "Generated TASKS.md projection".
name: tasks-snapshot
on:
  # The tasks-claims branch is an orphan log with no `.github/workflows`, so a
  # `push:` trigger there can never fire (GitHub looks for the workflow on the
  # pushed branch). Refresh on a schedule and on demand instead.
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tasks-snapshot
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Render to a temp file and only swap on success, so a transient failure
      # (or a CLI version that predates the git-native backend) skips the cycle
      # gracefully instead of failing the run or truncating TASKS.md.
      - run: |
          if npx -y @tasks-md/cli render --backend git-native > TASKS.md.next; then
            mv TASKS.md.next TASKS.md
          else
            echo "projection skipped: tasks render unavailable"
            rm -f TASKS.md.next
            exit 0
          fi
      - name: Open/update the snapshot PR
        run: |
          git config user.name "tasks-md-bot"
          git config user.email "tasks-md-bot@users.noreply.github.com"
          git checkout -B tasksmd/generated-snapshot
          git add TASKS.md
          git commit -m "chore: regenerate TASKS.md snapshot" || exit 0
          git push -f origin tasksmd/generated-snapshot
