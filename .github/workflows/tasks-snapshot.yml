# Generated by `tasks fleet init`. Single-writer regeneration of TASKS.md
# from the tasks-claims log. See spec.md § "Generated TASKS.md projection".
name: tasks-snapshot
on:
  # The tasks-claims branch is an orphan log with no `.github/workflows`, so a
  # `push:` trigger there can never fire (GitHub looks for the workflow on the
  # pushed branch). Near-real-time refresh comes from a repository_dispatch the
  # git-native backend fires after a claims push (opt-in via `.tasksmd.json`
  # `"autoRefresh": true`); the schedule + on-demand are the fallbacks.
  repository_dispatch:
    types: [tasks-claims-updated]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tasks-snapshot
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # This repo IS the @tasks-md/cli source, so build + run the local cli
      # instead of `npx @tasks-md/cli` (the generic fleet-init form). npx would
      # fetch the published package and is subject to registry mirror lag right
      # after a release. fleet init never clobbers this file, so the divergence
      # is durable — see AGENTS.md § Release And CI Gotchas.
      - run: npm ci
      - run: npm run build
      # Render to a temp file and only swap on success, so a failure skips the
      # cycle gracefully instead of failing the run or truncating TASKS.md.
      - run: |
          if node packages/cli/dist/cli.js render --backend git-native > TASKS.md.next; then
            mv TASKS.md.next TASKS.md
          else
            echo "projection skipped: render failed"
            rm -f TASKS.md.next
            exit 0
          fi
      - name: Open/update the snapshot PR
        run: |
          git config user.name "tasks-md-bot"
          git config user.email "tasks-md-bot@users.noreply.github.com"
          git checkout -B tasksmd/generated-snapshot
          git add TASKS.md
          git commit -m "chore: regenerate TASKS.md snapshot" || exit 0
          git push -f origin tasksmd/generated-snapshot
