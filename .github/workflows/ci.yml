name: CI

# The hosted copy of the local gate. It runs on GitHub's standard runners,
# which are free for public repositories. See docs/release-and-ci.md.
#
# Safety:
# - No secrets are used. A fork PR gets a read-only token and no secrets.
# - Actions are pinned by commit SHA. The runner image is pinned.
# - Steps never print the environment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never send usage data from a runner.
  DO_NOT_TRACK: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build linter
        run: npm run build --workspace packages/parser --workspace packages/lint

      - name: Lint examples
        run: node packages/lint/dist/cli.js examples/

      - name: Lint TASKS.md
        run: |
          if [ -f TASKS.md ]; then
            node packages/lint/dist/cli.js --require-prereg TASKS.md
          fi

      - name: Check docs backend drift
        run: |
          node scripts/check-docs-backend-drift.mjs --self-test
          node scripts/check-docs-backend-drift.mjs

      - name: Check volatile inventory counts
        run: npm run lint:volatile-counts

      - name: Check docs contract
        run: npm run lint:docs-contract

      - name: Test the changelog generator
        run: npm run lint:changelog

  commands-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Regenerate command files
        run: node packages/cli/dist/cli.js generate-commands

      - name: Check for drift
        run: |
          if ! git diff --exit-code commands/; then
            echo ""
            echo "ERROR: Generated command files are out of date."
            echo "Run: npx tasks-cli generate-commands"
            echo "Then commit the updated files."
            exit 1
          fi
          echo "✓ Generated commands match canonical source"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run all tests
        run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Packs every package, installs the tarballs like a stranger would, and
      # runs one test file per user story (tests/e2e/).
      - name: User-story e2e tests
        run: bash scripts/e2e.sh

  action-dogfood:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Drop `examples/` from the dogfood path until @tasks-md/lint publishes
      # a release containing the doc-filename skip in packages/lint/src/lint.ts.
      # The local `Lint examples` step in the `test` job still covers it via
      # the in-repo build, so we don't lose coverage on this PR.
      - uses: ./.github/actions/lint
        with:
          paths: "TASKS.md"
