description = "Pick a queued TASKS.md item, target an exact task ID, or run the standing audit loop"

prompt = '''
# Next Task
If a task ID is supplied, target that exact task; otherwise pick the highest-priority unblocked task from TASKS.md and work on it autonomously. Queue mode loops until the queue is empty or the user stops you; targeted mode stops after that task is shipped or explained.
Pre-flight stop check
Before anything else — including the context snapshot — check whether the autonomous session should exit immediately. If the repo ships a `scripts/check-zero-ship-streak.mjs` (the convention written in [tasks.md issue tracking](https://github.com/tasksmd/tasks.md)), run it first:
if [ -f scripts/check-zero-ship-streak.mjs ]; then
  result=$(node scripts/check-zero-ship-streak.mjs 2>&1)
  echo "$result"
  if echo "$result" | head -1 | grep -q '^STOP'; then
    echo ""
    echo "Stop-condition reached. Exiting session — the next session re-runs this check."
    exit 0
  fi
fi
The script's first line is `STOP` or `CONTINUE`. `STOP` fires when the audit cascade is exhausted (last 3 commits on `origin/master` are docs-only with no `closes <task-id>` token) or when 100% of TASKS.md tasks carry a non-empty `**Blocked**` metadata line. Either signal means another autonomous session won't unblock anything — exit cleanly.
If your session prompt mentions a prior `productive_zero_ship` or `diminishing_returns` warning from the orchestrator, treat that as an additional hard stop independent of the script's output.
If the script doesn't exist (the repo hasn't adopted the check yet), or it prints `CONTINUE`, proceed to the context snapshot below.
Context snapshot
Before doing anything else, capture the current state:
git status --short && git branch --show-current && git log --oneline -5
git_root=$(git rev-parse --show-toplevel 2>/dev/null || echo ".") && cat "$git_root/TASKS.md" 2>/dev/null || echo "(no TASKS.md)"
Use this output to decide where to start — do not re-run these unless state changes.
Policies
After reading TASKS.md, check for `<!-- policy: ... -->` HTML comments. These are project rules you must follow throughout the session:
- **File-level policies** (between `# Tasks` and first `## P*`) apply to every task
- **Section-level policies** (after a `## P*` heading) apply only to tasks in that section
Read all policies before picking a task. Follow them alongside the task's own metadata. If a policy conflicts with a task's instructions, the policy takes precedence — it's the project owner's rule.
Optional task-ID argument
The command accepts one optional argument: an exact TASKS.md `**ID**` value. Treat any non-empty text after the command name as the target ID after trimming whitespace; do not fuzzy-match or normalize beyond exact `**ID**:` comparison. If the context snapshot only loaded the root `TASKS.md`, search the current repo's `TASKS.md` files before declaring the target missing or duplicate.
- `/next-task` — queue mode: follow the decision tree, resume work, pick P0→P3, and roam or audit when the current queue is empty.
- `/next-task <task-id>` — targeted mode: locate exactly one task whose `**ID**:` equals `<task-id>`. Targeted mode bypasses priority ordering and "hardest first", but never bypasses policies, claims, blockers, forbidden-work checks, verification, or completion removal.
If a target ID is provided, handle it before [Resume unfinished work](#resume-unfinished-work) and [Pick a task](#pick-a-task):
1. **Missing** — if no task has that ID, report that `<task-id>` was not found and stop. Do not pick another task, roam, or run the audit.
2. **Duplicate** — if more than one task has that ID, report every matching file/path and stop so the queue can be fixed.
3. **Claimed** — if the target is claimed by another agent, report the claim and stop. If it is claimed by you, resume it.
4. **Blocked** — if it has a non-empty `**Blocked**:` reason, or any `**Blocked by**:` reference that still exists in any TASKS.md, report the blocker(s) and stop.
5. **Actionable** — claim it (or keep your existing claim), then continue at [Refuse forbidden work](#refuse-forbidden-work), [Plan](#plan-complex-tasks-only), and [Claim and do the work](#claim-and-do-the-work). When it completes, ship it and stop; do not fall through to generic queue mode unless the user invokes `/next-task` again.
If the targeted task is refused because it requires forbidden work, add the `**Blocked**:` reason as usual, commit that hunk, explain the refusal, and stop instead of continuing to the next task.
Standing audit loop tasks
A task is a standing audit loop when its `**ID**:` is `standing-audit-gap-loop` or its `**Tags**:` include `standing-loop`. When selected in queue mode or targeted mode:
1. Treat `**Details**:` and `**Files**:` as the repo-specific audit brief. If they are sparse, fall back to README.md, AGENTS.md, user stories, examples, package scripts, and recent git history.
2. Audit only: read files, run local read-only checks, and inspect behavior as needed, but do not implement code or docs fixes discovered by the audit.
3. Add or refine actionable tasks in TASKS.md with IDs, tags, details, files, and acceptance criteria. Avoid duplicates by checking existing task IDs and summaries first.
4. Remove the standing-loop task block in the same commit that adds or updates follow-up tasks. If no gaps are found, remove the task and make the commit message say the audit found no queue additions.
5. Stop after the standing audit loop commit. The next `/next-task` invocation can implement the newly queued work.
Decision tree
Read the context snapshot and follow the first matching branch:
**Uncommitted changes on a feature branch** → check if they belong to a claimed task. If yes, skip to [Finish the work](#finish-the-work). If unrelated, preserve them and continue:
1. Inspect the dirty files with `git diff -- <path>`.
2. If your task can avoid those files, leave them untouched and keep working.
3. If you must touch a dirty file, edit on top of the current contents so both sets of changes survive.
4. Stage only your paths or hunks. Never stage unrelated edits.
5. Never `git stash`, `git reset --hard`, `git checkout --`, or ask the user what to do just because the tree is dirty.
**On main, uncommitted changes** → preserve them too. If they belong to unfinished work, create or switch to that task branch and continue there. If they are unrelated or from another agent, leave main untouched and create a fresh branch or worktree from the current HEAD for your task. Do not stash or discard the existing changes.
**On a feature branch, no uncommitted changes** → check if there's a claimed task for this branch in TASKS.md. If yes, skip to [Finish the work](#finish-the-work). If not, switch to main.
**On main, clean** → continue to [Tidy open PRs](#tidy-open-prs).
**Shared-file rule** → `TASKS.md`, `README.md`, and agent config files often contain unrelated edits from another agent. Do not treat that as a stop signal. Apply your change on top of the live file, then stage only your exact hunk so both changes survive.
Tidy open PRs
Quickly land or close dangling PRs before picking new work:
gh pr list --state open --json number,title,mergeable,statusCheckRollup
- Checks pass + no conflicts → `gh pr merge <number> --squash --delete-branch`
- Checks failing or conflicts → skip
- Stale (>7 days, no linked task) → `gh pr close <number>` + delete the branch
Then sync:
git pull --rebase
git branch --merged main | grep -v '^\*\|main\|master'
# delete each merged local branch: git branch -d <branch>
If there were no open PRs, skip the sync — you're already up to date from the context snapshot.
Find the queue
TASKS.md is already loaded from the context snapshot.
**If TASKS.md has no actionable tasks** — meaning the queue is literally empty, or
every remaining task is either claimed by another agent, has an unresolved
`**Blocked by**:`, or has a non-empty `**Blocked**:` reason (see
[Refuse forbidden work](#refuse-forbidden-work)):
1. First, check for [blocked tasks you can enrich](#enrich-blocked-tasks). When a
   task is blocked but its `**Last-enriched**` field is missing or older than 7
   days, spend this turn adding read-only research notes so the developer has an
   easier time picking it up once the block resolves. Enrichment never touches
   the `**Blocked**` or `**Blocked by**` lines.
2. If every blocked task is freshly enriched (or there are no blocked tasks at
   all), proceed to [Empty queue: roam to the next repo](#empty-queue).
**Large or complex tasks are still actionable.** A P0 epic with 5 acceptance
criteria is not "no actionable tasks" — it needs decomposition, not avoidance.
**When all remaining tasks are large/complex:** Decompose the highest-priority one:
1. Pick the first unclaimed, unblocked task (P0 → P1 → P2 → P3)
2. Break it into 2-4 sub-tasks in TASKS.md (same priority, add `**Parent**: <original-id>`)
3. Each sub-task should be one-commit-sized (1-3 files)
4. Commit: `chore: decompose <task-id> into sub-tasks`
5. Implement the first sub-task
6. Do NOT run the audit while decomposable tasks exist
Enrich blocked tasks {#enrich-blocked-tasks}
When every remaining task in the current repo is blocked — either by an unresolved `**Blocked by**:` or by a `**Blocked**:` reason — don't just roam. Spend this turn **enriching** the blocked tasks with read-only research so the developer has less discovery work to do once the block resolves.
**Pick one blocked task.** Prefer, in order:
1. Highest priority (P0 → P1 → P2 → P3).
2. Most downstream consumers — tasks whose `**Blocked by**:` references this task's `**ID**` are waiting on it; enriching those blockers pays compounding interest.
3. Staleness — pick a task whose `**Last-enriched**` field is missing or older than 7 days. Skip tasks enriched more recently than that. If every blocked task has a fresh `**Last-enriched**`, move on to [Empty queue: roam to the next repo](#empty-queue) instead.
**Research, read-only.** No file edits outside TASKS.md, no shell side-effects, no network writes. The agent may:
- Re-read the task's full metadata block.
- Read the files listed in `**Files**:`.
- `grep` the codebase for terms from the task summary, details, and IDs.
- Read `AGENTS.md`, `README.md`, relevant docs, and recent git log entries.
- For `**Blocked**:`-by-reason tasks:
  - If the block is about posting publicly (Slack, Jira, GitHub issues), draft the **exact** message text the user would paste, list the surface + recipients, and note any links or ping targets. Sample tone from prior posts in git log or pinned docs.
  - If the block is about credentials or environment access, document which credentials are needed, who owns them, and where the request goes.
  - If the block is a refused policy, document alternatives the user could consider.
- For `**Blocked by**:` dependency tasks:
  - Read the blocker task's current state (metadata, any WIP branches, related PRs) and note what it will produce.
  - Sketch the consuming approach: where the new code will live, which tests it will add, and which acceptance criteria will carry over.
**Append findings to the task block.** Stage only the hunks inside the task's own block — never touch unrelated tasks, and never touch the task's `**Blocked**` or `**Blocked by**` lines.
1. Extend `**Research**:` with today's notes. The first dated heading goes on the same line as the field label; body text follows on 4-space-indented continuation lines. When you accumulate over sessions, append a blank line + a new dated subheading to the existing field:
   `
     - **Research**: 2026-04-20 — draft message
       :rocket: v1.2 is live — highlights:
       • Rate limiter now honors `X-Api-Key` headers
       • Webhook processor is idempotent by event ID
       Deploying 09:00 Pacific; rollback plan in runbooks/rate-limiter.md.
       Recipients: #eng-announcements, #customer-success.
   `
   Don't overwrite prior research — append a new heading under the same field. The parser treats indented continuation lines (4+ spaces) as part of the value, so the Research field stays a single growing string.
2. If research surfaced new files worth knowing about, append them to `**Files**:`. Don't rewrite the author's existing entries.
3. If research surfaced sharper acceptance criteria, append them to `**Acceptance**:`. Again, append — don't edit the author's text.
4. Stamp the task with `**Last-enriched**: YYYY-MM-DD` using today's UTC date. If the field already exists, overwrite it with today's date.
**Commit and move on.** Stage only the blocked task's hunk; the commit message should be:
chore: enrich <task-id> with research notes
Do not claim the task. Do not push to any public surface (the work stayed local to TASKS.md, which is what you already commit on a feature branch or directly on main depending on the repo's workflow).
After committing, return to [Find the queue](#find-the-queue). The task is still blocked — the next pick step will skip it because the `**Blocked**` / `**Blocked by**` line is still there — but it's now richer for the next session or the human reviewer.
> **MCP shortcut:** If `tasks-mcp` is available, use `enrich_task` — it appends `**Research**` notes, optionally extends `**Files**` / `**Acceptance**`, and sets `**Last-enriched**` atomically without manual file editing.
Empty queue: roam to the next repo {#empty-queue}
When the current repo's queue is truly empty (no unclaimed, unblocked tasks):
1. **Scan for work across repos:**
# Find all TASKS.md files in ~/apps/
for repo in ~/apps/*/; do
  tasks_file="$repo/TASKS.md"
  [ -f "$tasks_file" ] || continue
  # Count unclaimed, unblocked tasks per priority (P0 first)
  p0=$(grep -c '^\- \[ \]' "$tasks_file" 2>/dev/null | head -1)
  blocked_by=$(grep -c '\*\*Blocked by\*\*:' "$tasks_file" 2>/dev/null | head -1)
  blocked=$(grep -c '\*\*Blocked\*\*:' "$tasks_file" 2>/dev/null | head -1)
  actionable=$((p0 - blocked_by - blocked))
  [ "$actionable" -gt 0 ] && echo "$repo $actionable"
done
2. **Pick the repo with the highest-priority work** (most P0 > most P1 > most total).
   Read each candidate's TASKS.md to verify tasks are truly actionable (not just recurring/watch tasks).
3. **Switch without asking:**
   Switching to ~/apps/<repo> (N actionable tasks)
   Then `cd` to that repo and restart the next-task loop from the top.
4. **If ALL repos are empty/blocked**, run the [audit cascade](#audit-cascade).
Audit cascade {#audit-cascade}
Run these tiers **in order** on the current repo. Stop as soon as any tier produces actionable findings — write them as tasks to TASKS.md and implement the highest-priority one immediately.
**The audit is re-runnable.** Every time you reach this point (queue empty, all repos checked), run the full cascade from Tier 1. Code changes between sessions may introduce new findings. Never treat a previous audit as "permanently done."
**Tier 1 — Verify**
- `git pull --rebase` and prune stale worktrees (`git worktree list`)
- Run the full verify suite: typecheck, lint, test, build
- Any failure → write a task, fix it
**Tier 2 — Security & dead code**
- Hardcoded secrets, missing input validation, unsafe patterns
- Dead exports, unused variables, unreachable code paths
- Actionable `TODO`, `FIXME`, `HACK` comments
**Tier 3 — Doc drift & stale references**
- README examples vs actual behavior
- AGENTS.md with outdated build/test commands
- Stale comments referencing changed or deleted code
- Broken links in docs
**Tier 4 — Dependency modernization** *(applies to every repo type)*
- Node.js: outdated packages, deprecated APIs, missing lockfile entries
- Rust: `cargo outdated`, deprecated crate features
- Python: pinned versions with known CVEs, deprecated stdlib usage
- Shell/Markdown repos: outdated tool references, broken install instructions, stale CI action versions
- Any repo: LICENSE accuracy, .gitignore completeness, CI config drift
**Tier 5 — DX polish** *(applies to every repo type)*
- Help text accuracy: do `--help` outputs match actual behavior?
- Error message quality: are failures actionable or cryptic?
- Naming consistency: file names, function names, CLI flags vs project conventions
- Onboarding friction: can a new contributor clone → run in < 5 minutes?
- Example accuracy: do code examples in docs actually work when copy-pasted?
**After each tier:** if you found issues, write tasks to TASKS.md (with ID, Tags, Details, Files, Acceptance) and start working on the highest-priority one. Do not continue to the next tier — fixing a real issue is more valuable than completing the audit.
Terminal state {#terminal-state}
If ALL five tiers produce zero findings across ALL repos:
1. Print a final summary exactly once:
   All [N] repos scanned. Audit clean across 5 tiers. Nothing to do — stopping.
   Repos checked: [list]
2. **Stop the loop.** Do not print "nothing to do" again on subsequent invocations in the same session.
3. If the user invokes `/next-task` again (new session), re-run the full loop from the top — starting with the context snapshot. The audit is fresh each session.
Resume unfinished work
Scan TASKS.md for your `(@agent-id)` claim:
- **Found + work is done but not committed** → skip to [Ship it](#ship-it)
- **Found + work is in progress** → skip to [Finish the work](#finish-the-work)
- **Found + stale (no related code)** → unclaim (remove `(@agent-id)`), pick fresh
- **None found** → continue to [Pick a task](#pick-a-task)
Pick a task
When no task ID was provided, walk **P0 → P1 → P2 → P3** in order. Within each level, prefer:
1. Tasks whose **ID** appears in another task's `**Blocked by**` — completing them unblocks others
2. Tasks with no `**Blocked by**`, or whose blockers no longer exist in any TASKS.md
3. Unclaimed — skip tasks with `(@agent-name)` that isn't you
4. **Hardest first** — architectural, multi-file, or ambiguous tasks over simple ones
Treat a task with a non-empty `**Blocked**:` line as blocked even if it has no `**Blocked by**` — that field is for external constraints (see [Refuse forbidden work](#refuse-forbidden-work)) and should be skipped until the reason is resolved.
If everything is blocked or claimed, tell the user and suggest unblocking actions.
> **MCP shortcut:** If `tasks-mcp` is available, use `pick_task` — it applies these rules automatically.
Refuse forbidden work {#refuse-forbidden-work}
Before claiming a task, check whether completing it would require an action that is **blocked by default** for agents running autonomously. These actions must not happen unless the user explicitly approves them in the current session.
**Blocked by default** (refuse unless the user approved this exact action in-session):
- **Slack / Teams / Discord** — posting messages, DMs, thread replies, notifying reactions, channel creation, setting status on the user's behalf
- **Jira / Linear / Asana issues** — creating issues, posting comments, changing status or assignee, editing watchers, creating linked issues
- **GitHub issues** — `gh issue create`, `gh issue comment`, `gh issue edit|close|reopen`
- **GitHub PR review-side writes** — `gh pr comment`, `gh pr review`, review-body comments, requesting reviewers, assignee changes, labels that trigger notifications or automation
- **Public git writes** — `gh repo create`, `gh release create`, pushing to `main`/`master` of a public remote, force-pushing shared branches
- **Package registries** — `npm publish`, `cargo publish`, `pip upload`, `gem push`, and equivalents
- **Email / SMS / pager / ntfy / phone notifications** — anything that pages a real person
**Allowed by default** (normal agent workflow — no extra approval needed):
- **Opening pull requests** — `gh pr create` including title and body is OK. Pushing the feature branch the PR tracks is OK. Editing your own PR description and title after the fact is OK.
- **Reading anything** — Slack search, Jira view, `gh pr|issue view`, browsing dashboards
- **Local-only actions** — commits on feature branches, writing files, TASKS.md updates, local test runs
When a task requires a blocked-by-default action that the user has not approved:
1. **Do not claim and do not attempt the action.** An untasked "post to Slack" is still a post to Slack.
2. Add a `**Blocked**:` metadata line to the task block with an actionable reason. Start the reason with a short code so future sessions can recognize the pattern at a glance. Recommended codes: `needs-user-approval`, `needs-credentials`, `policy-refused`, `needs-external-action`.
   Example edit to TASKS.md:
   - [ ] Post v1.2 release summary in #eng-announcements
     - **ID**: slack-release-notes
     - **Blocked**: needs-user-approval — posting publicly in Slack as the user
       requires explicit per-session approval. Ask the user to post this themselves
       or confirm before unblocking.
3. Stage only that hunk of `TASKS.md` and commit with a conventional message such as `chore: block <task-id> (<short-code>)`. Do not push an approval request anywhere public — the block lives in the file.
4. Continue with the next highest-priority unblocked task. Future `/next-task` invocations will skip the blocked task automatically because the parser and task-picker treat a non-empty `**Blocked**:` as a block. In targeted mode, stop after committing the block instead of continuing to another task, because the user asked for that exact ID.
Only unblock a task (remove the `**Blocked**:` line) when the user has explicitly approved the exact action in the current session — quoting the surface, recipient, and text if applicable — or when the external constraint has otherwise been resolved (credentials issued, legal sign-off received, etc.). Never reuse an approval across sessions.
If the task is blocked purely because of a task-dependency (not an external constraint), use `**Blocked by**: <id>` instead; that mechanism is for the dependency graph and is resolved automatically when the blocker task is completed and removed.
Plan (complex tasks only)
A task is complex if it spans multiple files, involves architectural decisions, or will take > 1 hour. **When in doubt, treat it as complex.**
1. Explore the code: read files, trace call paths, understand data flow
2. Add a `**Plan**:` checklist to the task block in TASKS.md:
- [ ] Task description (@your-agent-id)
  - **Details**: original details
  - **Plan**:
    - [ ] Sub-step 1
    - [x] Sub-step 2
3. Stage only the TASKS.md hunk for your plan (never blindly `git add TASKS.md` if the file already has other edits), then `git commit -m "chore: add plan for <task-id>"`
4. Work through sub-steps, checking them off as you go
**Simple tasks** (single file, obvious fix, < 30 min): skip planning, implement directly.
Claim and do the work
> **MCP shortcut:** `claim_task` in `tasks-mcp` does this automatically.
Add your identity to the task line:
- [ ] The task description (@gemini, @gemini-2)
Create a branch and do the work:
git checkout -b <branch-name>
- Follow **Details**, **Files**, and **Acceptance** in the task metadata
- Check AGENTS.md for build, test, and lint commands
- Make minimal, focused edits — fix the root cause, not the symptom
- Run verification (test/lint/typecheck) before moving on
Scout while you work
While implementing, you have deep context about the code you're touching. **Actively look for gaps and record them as new tasks.** This happens naturally as you read and modify code — don't treat it as a separate pass.
**What to look for:**
- Bugs, edge cases, missing error handling in code you're reading
- Missing tests for critical code paths you discover
- TODOs, FIXMEs, or HACKs in files you touch
- Stale comments or docs referencing changed/deleted code
- Code duplication near your changes
- Security concerns (hardcoded secrets, missing validation, unsafe patterns)
- Inconsistencies with project conventions from AGENTS.md
**How to record:**
- Add new tasks to TASKS.md under the appropriate priority:
  - **P1** — bugs, security issues, broken behavior
  - **P2** — missing tests, code health, stale docs
  - **P3** — refactoring, nice-to-haves, minor DX improvements
- Include **Files** and **Details** so the next agent has context
- Keep descriptions actionable — "Fix X in Y" not "X seems wrong"
- Do NOT stop current work to fix discoveries — just record and move on
- Include TASKS.md additions in your commit when you ship the current task
**Goal:** Every completed task should leave the queue with more queued improvements than when you started. You're not just executing tasks — you're scouting the terrain for future work.
**HARD RULE:** Before shipping any PR, check: did you discover anything while working? If yes, add it to TASKS.md in the same commit. If you're not sure, you didn't look hard enough — re-read the files you touched and find at least one improvement. An empty scout log means you weren't paying attention.
Finish the work {#finish-the-work}
Verify the implementation is complete:
- All acceptance criteria from the task are met
- Tests pass, lint is clean
- No unrelated changes are staged
- **The completed task block is removed from TASKS.md** (task line + all metadata lines). This is not optional — a task is not done until it's gone from the file. History lives in git log.
Ship it {#ship-it}
> **MCP shortcut:** `complete_task` in `tasks-mcp` removes the task block automatically.
**Every commit that completes a task MUST also remove that task from TASKS.md.** No exceptions. If you forget, go back and amend the commit before pushing.
git add <changed-files>
# If TASKS.md has unrelated edits, stage only your task hunk before committing.
git commit -m "<type>: <description>"
git push
gh pr create --title "<type>: <description>" --body "<what changed and why>"
If rebase conflicts on TASKS.md: re-read the file, re-apply only your task change on top of the current contents, stage only that hunk, then `git rebase --continue`.
Loop
git checkout main 2>/dev/null || git checkout master && git pull --rebase
In queue mode, go back to [Find the queue](#find-the-queue) and pick the next task. Continue until the queue is empty or the user stops you. In targeted mode, stop after shipping the target task.
---
Constraints
- **Do not ask which task to pick in queue mode** — when no target ID is supplied, walk P0→P3 and pick the first unblocked, unclaimed task. Asking wastes the user's time.
- **Do not ask for confirmation before starting** — announce the chosen task in one line and begin.
- **Auto-roam when the queue is empty in queue mode** — scan `~/apps/*/TASKS.md` for work in other repos. Only stop and audit when ALL repos are empty. In targeted mode, stop on missing, blocked, or completed targets.
- **Do not mark tasks `[x]`** — remove the entire block. Checked-off tasks clutter the queue. A task with code changes committed but still present in TASKS.md is **not done**.
- **Do not stop after one task in queue mode** — loop until the queue is empty or the user interrupts. In targeted mode, work only the requested ID and then stop.
- **Do not claim tasks already claimed by another agent** — skip `(@agent-name)` unless it's your own stale claim.
- **Do not run blocked-by-default actions** — see [Refuse forbidden work](#refuse-forbidden-work). Instead of attempting a Slack/Jira/issue-comment/publish action, add `**Blocked**: <reason>` to the task so it's skipped in future sessions.
- **Enrich before roaming** — when every remaining task is blocked, run [Enrich blocked tasks](#enrich-blocked-tasks) instead of jumping straight to another repo. Read-only research on the task's `**Research**:` field leaves the next session (or the human) with less work to do.
- **Audit findings become tasks** — when all repos are empty, run the 5-tier cascade, write findings as tasks, and implement the highest-priority one. Only stop when all tiers are clean (terminal state).
'''
